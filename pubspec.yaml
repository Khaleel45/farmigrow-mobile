name: farmigrow_ai
description: FarmiGrow AI - Smart Farming Assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  geolocator: 10.1.0
  permission_handler: ^11.3.0
  image_picker: ^1.1.2
  flutter_local_notifications: 17.2.4
  uuid: ^4.5.1
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3

dependency_overrides:
  geolocator_windows: 0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
